<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Favicon -->
   <link rel="icon" href="Image/Pizza.jpg"> 
   <link rel="stylesheet" href="styles/pizza-styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The best pizza</title>
  
</head>
<body>
  <div id="main">
    <div id="header">
      <img src="Image/pizzaGuy.jpg">
      <h1>Poppa's Pizza</h1>
      <h2>Serving our GRC students for over 50 years!</h2>
      <hr>
      <p> We make the best pizza ever. Visit us today.
        <a id="contact-button" href="#" role="button"> Contact us</a>
    </div>
    <form id="pizza-form" action="#" method="get">
      <!-- Contact info -->
       <fieldset>
        <legend> Contact Info</legend>
        <label for="fname"> First name: </label>
        <input type="text" id="fname" name="fname">
        <label for="lname"> Last name: </label>
        <input type="text" id="lname" name="lname">
        <label for="email"> Email: </label>
        <input type="email" id="email" name="email"> 
       </fieldset>
       <button type="submit" id="order-button"> Place Order </button> 
             
    </form>
  </div>
</body>
</html>
